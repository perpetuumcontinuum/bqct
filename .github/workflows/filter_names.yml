name: Filter Names from core.json

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Words per LLM request'
        required: false
        default: '50'

concurrency:
  group: filter-names-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Cache Qwen model
        uses: actions/cache@v4
        with:
          path: models/Qwen3-14B-Q5_K_M.gguf
          key: qwen3-14b-q5km-v1

      - name: Cache pip deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: heavy-deps-ubuntu-24.04-v1
          restore-keys: |
            heavy-deps-ubuntu-24.04-

      - name: Install deps
        run: |
          pip install --upgrade pip setuptools wheel
          CMAKE_ARGS="-DGGML_BLAS=OFF -DGGML_CUDA=OFF" pip install --prefer-binary llama-cpp-python==0.3.20

      - name: Download Qwen model
        run: |
          set -e
          mkdir -p models
          FILE="models/Qwen3-14B-Q5_K_M.gguf"
          MIN_SIZE=100000000
          if [ -f "$FILE" ]; then
            FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -ge "$MIN_SIZE" ]; then
              echo "[OK] Model cached (${FILE_SIZE} bytes)."
            else
              rm -f "$FILE"
            fi
          fi
          if [ ! -f "$FILE" ]; then
            echo "[INFO] Downloading Qwen3-14B..."
            curl -L --retry 5 --retry-delay 15 -o "$FILE" "https://huggingface.co/Qwen/Qwen3-14B-GGUF/resolve/main/Qwen3-14B-Q5_K_M.gguf?download=true"
            FILE_SIZE=$(stat -c%s "$FILE" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -lt "$MIN_SIZE" ]; then
              echo "[ERROR] Download failed."
              exit 1
            fi
          fi

      - name: Run filter
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
          PYTHONUNBUFFERED: "1"
        run: python filter_names_llm.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add core.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Filter proper names from core.json (Qwen LLM)"
            git push
          fi
