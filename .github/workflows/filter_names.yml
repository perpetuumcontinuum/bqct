name: Filter Names

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Restore progress
        uses: actions/download-artifact@v4
        with:
          name: progress
        continue-on-error: true

      - name: Cache Qwen 3B
        uses: actions/cache@v4
        with:
          path: models/qwen2.5-3b-instruct-q5_k_m.gguf
          key: qwen25-3b-q5km-v1

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install llama-cpp-python --extra-index-url https://parisneo.github.io/llama-cpp-python-wheels/whl/cpu/

      - name: Download Qwen
        run: |
          set -e
          mkdir -p models
          FILE="models/qwen2.5-3b-instruct-q5_k_m.gguf"
          MIN_SIZE=1000000000
          if [ ! -f "$FILE" ] || [ "$(stat -c%s "$FILE" 2>/dev/null || echo 0)" -lt "$MIN_SIZE" ]; then
            curl -L --retry 5 --retry-delay 15 -o "$FILE" \
              "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q5_k_m.gguf?download=true"
          fi

      - name: Run filter
        env:
          PYTHONUNBUFFERED: "1"
          MAX_RUNTIME_SEC: "19000"
        run: python filter_all.py

      - name: Save progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: progress
          path: progress.json
          retention-days: 90
          if-no-files-found: warn

      - name: Save partial core
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-partial
          path: core.json
          retention-days: 90
          if-no-files-found: warn

      - name: Commit
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add core.json progress.json 2>/dev/null || true
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Filter names (auto)"
            git push
          fi
